# Device inventory -- the only file you edit to add, remove or rename a plug.
#
# `make deploy` turns this into the shelly-devices ConfigMap, so changing it
# and re-running deploy is the whole workflow.
#
# These are DHCP addresses. Give each device a static lease on the router, or
# this file goes stale the next time the lease pool shuffles. The MAC is in
# the comment on each entry so a lease can be pinned without re-scanning;
# `make discover` re-finds everything if they do move.
#
# `name` is identity: it becomes the `device` label and queries group by it,
# so it stays short and stable. `channels` is display: one label per switch
# component id, which is what you read on the graphs.
#
# A name set on the device itself wins over `channels`, and `make sync-names`
# writes everything here onto the devices so the two agree -- the Shelly app
# then shows the same names these graphs do. `make names` prints what each
# device currently calls itself and its outputs.
#
# A plug has only switch:0; the Power Strip 4 Gen4 has switch:0 through
# switch:3, one per socket.

defaults:
  timeoutMs: 4000

devices:
  # Shelly Plug S MTR Gen3 -- model S3PL-30110EU, MAC 08:3A:F2:D9:22:10
  # The k3s host, so it measures the machine drawing these graphs.
  - name: server-pc
    host: 192.168.0.21
    channels:
      0: Server PC

  # Shelly Plug S MTR Gen3 -- model S3PL-30110EU, MAC 08:3A:F2:D8:E0:6C
  - name: 3d-printer
    host: 192.168.0.66
    channels:
      0: 3D printer

  # Shelly 1PM Mini Gen3 -- model S3SW-001P8EU, MAC 54:32:04:6B:8A:40
  # Wired in behind the switch, not a plug. Lowest signal of the four
  # (-79 dBm), so it is the one that will time out.
  - name: terrace-lights
    host: 192.168.0.93
    channels:
      0: Terrace lights

  # Shelly Power Strip 4 Gen4 -- model S4PL-00416EU, MAC E8:F6:0A:63:8D:68
  # Four independently metered sockets, at the desk. switch:0 is unused;
  # rename it here when something goes into it.
  - name: pc-strip
    host: 192.168.0.128
    channels:
      0: Spare socket
      1: PC
      2: Acer monitor
      3: Dell monitor
